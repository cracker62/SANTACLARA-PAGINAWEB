<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Portal del equipo · JC</title>
<meta name="description" content="Acceso directo al portal comercial del equipo de Juan Carmona.">
<meta name="robots" content="noindex">
<!-- Iconos: esto es lo que ve el celular al "Agregar a inicio" -->
<link rel="icon" href="assets/img/jc-192.png" sizes="192x192">
<link rel="apple-touch-icon" href="assets/img/jc-180.png">
<link rel="manifest" href="portal.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Portal JC">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#143426">
<style>
  :root { --monte-hondo: #143426; --oro: #B4852A; --papel: #F7F5EF; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--monte-hondo); color: var(--papel);
         font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }

  /* El portal ocupa toda la pantalla */
  #portal { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; background: var(--monte-hondo); }

  /* Sello JC mientras carga */
  #cargando { position: fixed; inset: 0; display: grid; place-items: center; background: var(--monte-hondo); z-index: 2;
              transition: opacity .4s ease; }
  #cargando.listo { opacity: 0; pointer-events: none; }
  .sello { width: 116px; height: 116px; border-radius: 50%; border: 3px solid var(--oro); display: grid; place-items: center;
           color: var(--oro); font-family: Georgia, "Times New Roman", serif; font-size: 2.8rem; font-weight: 700; letter-spacing: 3px; }

  /* La ayuda para instalarlo solo se ve en el navegador, nunca dentro de la app */
  #instalar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 3; display: flex; gap: 12px; align-items: center;
              padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); background: rgba(20, 52, 38, .96);
              border-top: 1px solid rgba(180, 133, 42, .5); font-size: .85rem; line-height: 1.35; }
  #instalar b { color: var(--oro); }
  #instalar button { margin-left: auto; flex: none; background: transparent; border: 1px solid rgba(247, 245, 239, .35);
                     color: var(--papel); border-radius: 8px; padding: 6px 10px; font: inherit; cursor: pointer; }
  @media (display-mode: standalone) { #instalar { display: none; } }
  @media all and (display-mode: fullscreen) { #instalar { display: none; } }
</style>
</head>
<body>
  <iframe id="portal" title="Portal del equipo"
          src="https://script.google.com/macros/s/AKfycbwUlYP7CDP6joCpRikVoncmeuiQghQ6jO094pTxIGb68wTJrWLteoLn7qc4BrEMn9QA/exec"
          allow="clipboard-write; camera"></iframe>
  <div id="cargando"><div class="sello" aria-hidden="true">JC</div></div>
  <div id="instalar" hidden>
    <span>Toca <b>compartir</b> y elige <b>Agregar a pantalla de inicio</b>.</span>
    <button type="button" id="cerrar-instalar" aria-label="Cerrar">Listo</button>
  </div>
<script>
  (function () {
    var marco = document.getElementById('portal');
    var cargando = document.getElementById('cargando');
    marco.addEventListener('load', function () { cargando.classList.add('listo'); });
    setTimeout(function () { cargando.classList.add('listo'); }, 6000);

    // La ayuda aparece solo si todavía no lo agregaron a la pantalla de inicio.
    var comoApp = (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || window.navigator.standalone === true;
    var ocultada = false;
    try { ocultada = localStorage.getItem('jc_instalar_visto') === '1'; } catch (e) {}
    if (!comoApp && !ocultada) document.getElementById('instalar').hidden = false;
    document.getElementById('cerrar-instalar').addEventListener('click', function () {
      document.getElementById('instalar').hidden = true;
      try { localStorage.setItem('jc_instalar_visto', '1'); } catch (e) {}
    });
  })();
</script>
</body>
</html>
